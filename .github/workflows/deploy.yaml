name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:
  # Todo dia à meia-noite de Brasília (03:00 UTC): busca os artigos novos do
  # dev.to para a aba Blog e tira do site os eventos encerrados, sem depender
  # de um push.
  schedule:
    - cron: "0 3 * * *"

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez (o agendamento e um push podem coincidir).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Atualiza src/data/devto-artigos.json com a API do dev.to. Se a API
      # falhar, o script avisa e mantém a lista salva no repositório.
      - name: Artigos do dev.to (aba Blog)
        run: node scripts/buscar-devto.mjs
      - run: npm run build
      # Os artigos acabaram de chegar da API: confere SEO (canonical, um h1,
      # JSON-LD) e as regras do blog antes de publicar. Se falhar, o site
      # continua com a versão anterior e a execução aparece como falha.
      - name: Testes do build (SEO e blog)
        run: npx vitest run tests/seo tests/unit/lib
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
