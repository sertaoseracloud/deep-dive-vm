name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Unit + Integration tests (coverage gate >= 95%)
        run: npm run test:all
      - name: npm audit (supply-chain gate)
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
      - name: Publish coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          STMTS=$(node -e "
            const fs = require('fs');
            if (!fs.existsSync('coverage/coverage-summary.json')) {
              process.stdout.write('0%');
              process.exit(0);
            }
            const raw = fs.readFileSync('coverage/coverage-summary.json', 'utf8');
            const json = JSON.parse(raw);
            if (!json.total) { process.stdout.write('0%'); process.exit(0); }
            process.stdout.write(json.total.statements.pct.toFixed(1) + '%');
          ")
          COLOR="brightgreen"
          if [[ "$STMTS" == "0%" ]]; then COLOR="red"; fi
          PCT=${STMTS//%/}
          if [[ "$STMTS" != "0%" ]] && (( $(echo "$PCT < 75" | bc -l) )); then COLOR="red"
          elif [[ "$STMTS" != "0%" ]] && (( $(echo "$PCT < 90" | bc -l) )); then COLOR="yellow"; fi
          JSON="{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${STMTS}\",\"color\":\"${COLOR}\"}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin badges 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/badges; then
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . --quiet || true
            mkdir -p badges
          fi
          mkdir -p badges
          echo "$JSON" > badges/coverage.json
          git add badges/coverage.json
          git diff --staged --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git push origin badges
          git checkout main

  e2e-chromium:
    runs-on: ubuntu-latest
    needs: unit-and-integration
    permissions:
      contents: read   # no write needed — artifacts are uploaded, not committed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - name: E2E tests — Chromium (blocking)
        run: npx playwright test --project=chromium
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-chromium
          path: playwright-report/

  e2e-cross-browser:
    runs-on: ubuntu-latest
    needs: e2e-chromium
    permissions:
      contents: read   # no write needed — artifacts are uploaded, not committed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run build
      - name: E2E tests — Firefox, WebKit, mobile (informational)
        run: npx playwright test --project=firefox --project=webkit --project=mobile
        continue-on-error: true
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-cross-browser
          path: playwright-report/

  lighthouse:
    runs-on: ubuntu-latest
    needs: unit-and-integration
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: SEO static tests
        run: npx vitest run tests/seo
      - name: Lighthouse CI (SEO >= 90)
        run: npx lhci autorun
      - name: Commit LHCI filesystem results
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin lhci-results || git checkout --orphan lhci-results
          if git show-ref --verify --quiet refs/remotes/origin/lhci-results; then
            git checkout lhci-results
          fi
          git add .lighthouseci/
          git diff --staged --quiet || git commit -m "chore: update lhci results [skip ci]"
          git push origin lhci-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 30
